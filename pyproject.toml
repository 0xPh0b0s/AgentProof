[project]
name = "agentproof-cli"
version = "1.0.0"
description = "Independent verification that an AI agent actually completed the task it claimed to complete."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentProof Contributors" }]
keywords = ["llm", "agent", "verification", "audit", "cli", "proof"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://codeberg.org/0xPh0b0s/AgentProof"
Repository = "https://codeberg.org/0xPh0b0s/AgentProof"
Issues = "https://codeberg.org/0xPh0b0s/AgentProof/issues"
Changelog = "https://codeberg.org/0xPh0b0s/AgentProof/src/branch/main/CHANGELOG.md"

[project.scripts]
agentproof = "agentproof.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "agentproof" }]
include = [
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "assets/*.svg", format = "sdist" },
    { path = "examples/*.json", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
mypy = "^1.10.0"
ruff = "^0.6.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["agentproof"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = false
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
files = ["agentproof"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["agentproof", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
    "ANN", # flake8-annotations
]
ignore = [
    "D203",
    "D213",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN201", "ANN001"]
"agentproof/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
