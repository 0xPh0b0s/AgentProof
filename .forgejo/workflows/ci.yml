name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, types, tests (py${{ matrix.python-version }})
    runs-on: docker
    container:
      image: python:${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: https://codeberg.org/actions/checkout@v4

      - name: Install AgentProof
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest --cov=agentproof --cov-report=term-missing

  build:
    name: Build distributions
    runs-on: docker
    container:
      image: python:3.13
    steps:
      - uses: https://codeberg.org/actions/checkout@v4

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the wheel installs and the CLI works
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/agentproof --version
          /tmp/verify/bin/agentproof --demo --quiet || test $? -eq 1
